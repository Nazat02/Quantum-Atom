/* Resolve the theme BEFORE first paint so there is no light/dark flash.
   Same key as the rest of the site (qas-theme); falls back to dark like the
   other entry points. Also sets the browser chrome colour, the favicon and
   loads only the one brand font this theme needs. */
(function () {
  var t = 'dark';
  try { var s = localStorage.getItem('qas-theme'); if (s === 'light' || s === 'dark') t = s; } catch (e) {}
  var d = document, root = d.documentElement, light = t === 'light';
  root.setAttribute('data-theme', t);
  root.style.colorScheme = t;

  function add(tag, attrs) {
    var el = d.createElement(tag);
    for (var k in attrs) el.setAttribute(k, attrs[k]);
    d.head.appendChild(el); return el;
  }
  add('meta', { name: 'theme-color', content: light ? '#eef1ff' : '#090605' });

  var c = light ? '%236952e0' : '%23ff5b14';
  add('link', { rel: 'icon', type: 'image/svg+xml', href:
    "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 90 90'><rect width='90' height='90' rx='18' fill='" + c + "'/>" +
    "<g fill='none' stroke='white' stroke-width='2.4' stroke-opacity='.85'><ellipse cx='45' cy='45' rx='34' ry='12'/>" +

    "<circle cx='45' cy='45' r='10' fill='white'/></svg>" });

  add('link', { rel: 'stylesheet', href: light
    ? 'https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500..700&display=swap'
    : 'https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&display=swap' });
})();
</script>

<script>
(function () {
  'use strict';

  /* ───────── Config ───────── */
  var NAME = 'Md. Shaikhul Hadis Nazat';
  var NAME_SPLIT = ['Md. Shaikhul', 'Hadis Nazat'];            // two-line form for narrow/portrait screens
  var T = { start: 250, formEnd: 2700, crisp0: 2350, crisp1: 3150, leave: 3700 }; // ms
  var WATCHDOG_MS = 9000;                                        // never trap a visitor
  var IGNORE_TAP_MS = 500;                                       // a stray first touch must not skip the intro

  var THEMES = {
    dark:  { rgb: ['255,91,20', '255,178,31', '226,39,26', '255,122,58'], blend: 'lighter',
             alpha: .55, text: '#f6ebe2', glow: 'rgba(255,91,20,.55)',
             font: '800 100px "Bricolage Grotesque"', face: '800 {s}px "Bricolage Grotesque","Segoe UI",system-ui,sans-serif' },
    light: { rgb: ['105,82,224', '155,138,251', '56,189,248', '244,114,182'], blend: 'source-over',
             alpha: .34, text: '#211c42', glow: 'rgba(105,82,224,.25)',
             font: '700 100px "Space Grotesk"', face: '700 {s}px "Space Grotesk","Segoe UI",system-ui,sans-serif' }
  };

  var P = THEMES[theme];

  if (reduce) T = { start: 0, formEnd: 1, crisp0: 0, crisp1: 500, leave: 1500 };

  var badgeEl = $('badge'), byEl = $('by'), tagEl = $('tag'), barEl = $('bar'), orbitsEl = $('orbits');

  // Theme the logo mark exactly like the site's nav badge in each mode.
  if (theme === 'light') {
    $('sp-tile').setAttribute('fill', '#6952e0');
    $('sp-n1').setAttribute('stop-color', '#c4b5fd'); $('sp-n2').setAttribute('stop-color', '#9b8afb');
    $('sp-e2').setAttribute('fill', 'rgba(196,181,253,.95)'); $('sp-e3').setAttribute('fill', 'rgba(186,230,253,.9)');
  }
  if (reduce) { // freeze the logo too
    Array.prototype.slice.call(badgeEl.querySelectorAll('animate,animateTransform')).forEach(function (n) { n.parentNode.removeChild(n); });
  }

  // (about:srcdoc, blob:, data:, sandboxed previews), which makes `new URL` throw.
  var file = 'index_' + theme + '.html', destHref = file;
  try { destHref = new URL(file, location.href).href; } catch (e) {}
  try { if (/^https?:|^file:/.test(destHref)) destHref += location.search + location.hash; } catch (e) {}

  var gone = false, leaving = false, bornAt = Date.now();
  function go() {
    if (gone) return; gone = true;
    try { location.replace(destHref); } catch (e) { try { location.href = destHref; } catch (e2) {} }
  }
  function leave() {
    if (leaving) return; leaving = true;

    setTimeout(go, 480);
  }
  setTimeout(go, WATCHDOG_MS);
  $('skip').addEventListener('click', function (e) { e.stopPropagation(); leave(); });
  document.addEventListener('click', function () { if (Date.now() - bornAt > IGNORE_TAP_MS) leave(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ' || e.key === 'Escape') leave(); });

  /* ───────── Cloud sprites (one soft puff per brand colour) ───────── */
  var sprites = P.rgb.map(function (c) {
    var s = document.createElement('canvas'); s.width = s.height = 64;
    var g = s.getContext('2d'), r = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    r.addColorStop(0, 'rgba(' + c + ',1)'); r.addColorStop(.4, 'rgba(' + c + ',.55)'); r.addColorStop(1, 'rgba(' + c + ',0)');

  });

  /* ───────── Layout ─────────
     One pass decides line-breaking, type size and every gap from the viewport,
     so phones, tablets, laptops, ultrawide and landscape phones all keep the
     same proportions. The name's real ink bounds (not font metrics) drive the
     spacing, so the optical gaps above and below the name are equal. */
  var W, H, dpr, lines, fontPx, lineH, nameCy, parts = [], bgClouds = [], coarse = false;
  var clamp = function (x, a, b) { return x < a ? a : x > b ? b : x; };
  function rand(a, b) { return a + Math.random() * (b - a); }
  var faceAt = function (s) { return P.face.replace('{s}', s); };
  var meas = document.createElement('canvas').getContext('2d');

  function textWidth(t) { meas.font = faceAt(100); return meas.measureText(t).width; }

  // Render the name on a small canvas, return ink bounds + sampled points (relative to block centre).
  function sampleName(px, lh, ls, step) {
    var w = Math.ceil(Math.max.apply(null, ls.map(function (t) { return textWidth(t) * px / 100; })) + px * .6),
        h = Math.ceil(lh * ls.length + px * .6), pad = 2;
    var c = document.createElement('canvas'); c.width = w; c.height = h;
    var o = c.getContext('2d', { willReadFrequently: true });
    o.font = faceAt(px); o.textAlign = 'center'; o.textBaseline = 'middle'; o.fillStyle = '#000';
    ls.forEach(function (t, i) { o.fillText(t, w / 2, h / 2 + (i - (ls.length - 1) / 2) * lh); });
    var d = o.getImageData(0, 0, w, h).data, pts = [], minY = h, maxY = 0;
    for (var y = pad; y < h - pad; y += step) for (var x = pad; x < w - pad; x += step)
      if (d[(y * w + x) * 4 + 3] > 120) {
        pts.push([x - w / 2 + rand(-1, 1), y - h / 2 + rand(-1, 1)]);
        if (y < minY) minY = y; if (y > maxY) maxY = y;
      }

  function layout() {
    W = innerWidth; H = innerHeight; dpr = Math.min(window.devicePixelRatio || 1, 2);
    coarse = !!(window.matchMedia && matchMedia('(pointer:coarse)').matches) || W < 700;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    var cs = getComputedStyle(document.documentElement);
    var px = function (v) { return parseFloat(v) || 0; };
    var safeT = px(cs.getPropertyValue('--safe-t')), safeB = px(cs.getPropertyValue('--safe-b'));
    var margin = clamp(W * .06, 16, 120);
    var usableW = W - 2 * margin;

    // 1) line breaking: one line when it is comfortably large, else two (always two on portrait tablets/phones)
    var w1 = textWidth(NAME), px1 = usableW / w1 * 100;
    var portrait = W / H < .9 && W < 900;
    var two = portrait || px1 < 44;
    lines = two ? NAME_SPLIT : [NAME];
    var widest = Math.max.apply(null, lines.map(textWidth));
    var maxPx = two ? Math.min(usableW * .78 / widest * 100, H * .072, 150)
                    : Math.min(usableW / widest * 100, H * .13, W * .065);
    fontPx = Math.max(maxPx, 18);

    // 2) fit the whole stack (badge, "Built by", name, tagline) into the safe height
    var topR = Math.max(20, safeT + 12), botR = Math.max(72, safeB + 64);
    var avail = H - topR - botR, m, total;
    for (var i = 0; i < 12; i++) {
      m = metrics(fontPx, two);
      total = m.badge + m.g1 + m.byH + m.g2 + m.inkEst + m.g3 + m.tagH;
      if (total <= avail) break;
      fontPx *= .92;
    }
    lineH = fontPx * 1.12;
    m = metrics(fontPx, two);

    // 3) adaptive particle density (keeps low-end phones smooth)
    var maxParts = coarse ? 2600 : 6500, step = coarse ? 4 : 5, s;
    for (var k = 0; k < 4; k++) {
      s = sampleName(fontPx, lineH, lines, step);
      if (s.pts.length <= maxParts) break;
      step = Math.ceil(step * Math.sqrt(s.pts.length / maxParts));
    }

    // 4) place the stack: optically centred, slightly above the midline
    var inkH = s.bottom - s.top;
    total = m.badge + m.g1 + m.byH + m.g2 + inkH + m.g3 + m.tagH;
    var top = topR + Math.max(0, (avail - total) / 2) - H * .012;
    var byTop = top + m.badge + m.g1, inkTop = byTop + m.byH + m.g2, tagTop = inkTop + inkH + m.g3;
    nameCy = inkTop - s.top;                         // block centre that puts the ink at inkTop

    badgeEl.style.cssText = 'top:' + top + 'px;width:' + m.badge + 'px;height:' + m.badge + 'px';
    byEl.style.cssText = 'top:' + byTop + 'px;font-size:' + m.byFs + 'px';
    tagEl.style.cssText = 'top:' + tagTop + 'px;font-size:' + m.tagFs + 'px';
    orbitsEl.style.top = (nameCy / H * 100) + '%';

    var r = step * 1.55;
    parts = s.pts.map(function (p) {
      var tx = W / 2 + p[0], ty = nameCy + p[1];
      return { tx: tx, ty: ty, sx: rand(-.1 * W, 1.1 * W), sy: rand(-.1 * H, 1.1 * H),
               d: rand(0, .3) + .2 * (tx / W), s0: r * rand(3.5, 9), r: r * rand(.85, 1.15),
               ph: rand(0, 6.28), sp: rand(.4, 1), wob: rand(14, 46), c: (Math.random() * sprites.length) | 0 };
    });
    var cr = Math.min(W, H);
    bgClouds = [];
    for (var j = 0; j < (coarse ? 9 : 12); j++) bgClouds.push({ x: rand(0, W), y: rand(0, H), r: rand(.18, .34) * Math.max(cr, W * .5),
      v: rand(6, 16), c: (Math.random() * sprites.length) | 0 });
  }

  // Type-proportional sizes/gaps for the stack (single source of truth for spacing)
  function metrics(f, two) {
    var u = clamp(f, 22, 120);
    var byFs = clamp(u * .36, 15, 22), tagFs = clamp(u * .36, 15, 22);
    return {
      badge: clamp(u * 1.15, 52, 96), g1: clamp(u * .42, 16, 40),
      byFs: byFs, byH: byFs * 1.3, g2: clamp(byFs * .75, 10, 24),
      inkEst: f * (two ? .72 + 1.12 : .72), g3: clamp(f * .5, 20, 56),
      tagFs: tagFs, tagH: tagFs * 1.3 * (W < 420 ? 2 : 1)

  var ease = function (x) { return 1 - Math.pow(1 - x, 3); };
  var clamp01 = function (x) { return x < 0 ? 0 : x > 1 ? 1 : x; };

    ctx.save();
    ctx.globalAlpha = alpha; ctx.globalCompositeOperation = 'source-over';
    ctx.font = faceAt(fontPx); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = P.text; ctx.shadowColor = P.glow; ctx.shadowBlur = clamp(fontPx * .2, 8, 26);
    lines.forEach(function (t, i) { ctx.fillText(t, W / 2, nameCy + (i - (lines.length - 1) / 2) * lineH); });

  }

    if (gone) return;

      slow = dt > 30 ? slow + 1 : Math.max(0, slow - 1);
      if (slow > 8) { parts = parts.filter(function (_, i) { return i % 2 === 0; }); parts.forEach(function (p) { p.r *= 1.35; }); thinned++; slow = 0; }
    }

    ctx.clearRect(0, 0, W, H);
    ctx.globalCompositeOperation = P.blend;

    // slow background clouds, dissolving as the name forms
    var bgA = P.alpha * .6 * appear * (1 - smooth(form * 1.2));
    if (bgA > .005) bgClouds.forEach(function (c) {
      c.x += c.v * dt / 1000; if (c.x - c.r > W) c.x = -c.r;
      ctx.globalAlpha = bgA; ctx.drawImage(sprites[c.c], c.x - c.r, c.y - c.r, c.r * 2, c.r * 2);
    });

    // particle clouds coalescing into letterforms
    var settle = 1 - smooth((t - T.crisp0) / (T.crisp1 - T.crisp0)) * .55;
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i], q = ease(clamp01((form - p.d) / .5)), w = (1 - q) * p.wob, k = t * .001 * p.sp + p.ph;
      var x = p.sx + (p.tx - p.sx) * q + Math.sin(k) * w, y = p.sy + (p.ty - p.sy) * q + Math.cos(k * 1.3) * w;
      var s = p.s0 + (p.r - p.s0) * q;
      ctx.globalAlpha = P.alpha * (.35 + .65 * q) * appear * settle;
      ctx.drawImage(sprites[p.c], x - s, y - s, s * 2, s * 2);
    }

    drawText(smooth((t - T.crisp0) / (T.crisp1 - T.crisp0)));
    if (t > 100) { badgeEl.classList.add('on'); orbitsEl.classList.add('on'); }
    if (t > 450) byEl.classList.add('on');
    if (t > T.crisp1 - 200) tagEl.classList.add('on');
    barEl.style.transform = 'scaleX(' + clamp01(t / T.leave) + ')';
    if (t >= T.leave) leave();
    requestAnimationFrame(frame);
  }

  /* ───────── Boot: wait (briefly) for the brand font, then play ───────── */
  function start() {
    try { layout(); } catch (e) { return go(); }
    var rt; addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(function () { try { layout(); } catch (e) {} }, 150); });
    t0 = performance.now(); requestAnimationFrame(frame);
  }
  var fontReady = (document.fonts && document.fonts.load) ? document.fonts.load(P.font, NAME) : Promise.resolve();
  Promise.race([fontReady, new Promise(function (r) { setTimeout(r, 1000); })]).then(start, start);
})();
</script>
</body>
